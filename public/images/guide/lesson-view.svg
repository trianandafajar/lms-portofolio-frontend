  <text x="50" y="250" fill="#1e293b" font-size="14" font-weight="bold">Variables and Expressions</text>
  <text x="50" y="275" fill="#475569" font-size="11">In algebra, a variable is a symbol (usually a letter) that represents</text>
  <text x="50" y="292" fill="#475569" font-size="11">an unknown value. An expression is a combination of variables,</text>
  <text x="50" y="309" fill="#475569" font-size="11">numbers, and operations like addition and multiplication.</text>
  <text x="50" y="340" fill="#475569" font-size="11">For example: 2x + 3 is an expression where x is the variable.</text>
